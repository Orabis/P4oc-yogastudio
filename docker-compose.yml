services:
  postgres:
    image: postgres:16-alpine
    container_name: yoga-studio-db
    environment:
      POSTGRES_USER: yogauser
      POSTGRES_PASSWORD: yogapass
      POSTGRES_DB: yogastudio
    ports:
      - "5445:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yogauser -d yogastudio"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgres:16-alpine
    container_name: yoga-studio-db-test
    environment:
      POSTGRES_USER: yogauser
      POSTGRES_PASSWORD: yogapass
      POSTGRES_DB: yogastudio_test
    ports:
      - "5446:5432"
    tmpfs:
      - /var/lib/postgresql/data

  postgres-e2e:
    image: postgres:16-alpine
    container_name: yoga-studio-db-e2e
    environment:
      POSTGRES_USER: yogauser
      POSTGRES_PASSWORD: yogapass
      POSTGRES_DB: yogastudio_e2e
    ports:
      - "5447:5432"
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  postgres_data:
